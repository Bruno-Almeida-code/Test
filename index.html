<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pokédex Poster + Pokémon Cards Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>

/* ╔══════════════════════════════════╗
   ║  1. CSS VARIABLES                ║
   ╚══════════════════════════════════╝ */
:root{
  /* UI chrome */
  --bg: #0c0f16;
  --panel: #14181f;
  --panel2: #10141b;
  --text: #e4eaf5;
  --muted: #8a96b4;
  --border: #222d42;
  --accent: #5b9cf5;
  --accent-bg: rgba(91,156,245,0.12);
  --accent-border: rgba(91,156,245,0.35);
  --shadow: 0 8px 24px rgba(0,0,0,.3);
  --radius: 10px;
  --zoom: .55;

  /* A4 page at 300 dpi */
  --page-w: 2480px;
  --page-h: 3508px;

  /* Poster */
  --pad-poster: 20px;
  --poster-cols: 9;
  --poster-rows: 13;
  --poster-gap: 0px;
  --poster-gap-abs: 0px;
  --poster-name-fz: 18px;
  --poster-name-color: #111;

  /* Cards */
  --pad-cards: 0px;
  --card-cols: 3;
  --card-rows: 3;
  --card-gap: 12px;
  --card-gap-abs: 0px;
  --card-w: 760px;
  --card-h: 980px;
  --card-pad: 16px;
  --img: 480px;
  --sprite-shift-y: 0px;

  /* Card: evolution strip */
  --mini: 56px;
  --evo-fill: #eceff3;
  --evo-stroke: #fb923c;
  --evo-box-on: 0;
  --evo-box-scale: 0.8;
  --evo-box-bg: rgba(0,0,0,0.02);
  --evo-box-border: rgba(0,0,0,0.12);

  /* Card: typography */
  --head-fz: 26px;
  --meta-fz: 16px;
  --meta-label-fz: 28px;
  --meta-value-fz: 22px;
  --desc-fz: 14px;
  --meta-gap: 12px;

  /* Card: colors */
  --card-box-bg: #fff;
  --card-box-ink: #000;

  font-synthesis: none;
  text-rendering: geometricPrecision;
}


/* ╔══════════════════════════════════╗
   ║  2. RESET & BASE                 ║
   ╚══════════════════════════════════╝ */
*{ box-sizing: border-box; margin: 0; }
body{
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}


/* ╔══════════════════════════════════╗
   ║  3. APP LAYOUT                   ║
   ╚══════════════════════════════════╝ */
.app{ display: flex; min-height: 100vh; }

.sidebar{
  width: 400px;
  min-width: 400px;
  padding: 20px 16px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-header{
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.sidebar-header h1{
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.2px;
}

.stage-wrap{ flex: 1; overflow: auto; padding: 20px; }
.stage{ transform: scale(var(--zoom)); transform-origin: top left; }
#root{ display: flex; flex-direction: column; gap: 22px; }


/* ╔══════════════════════════════════╗
   ║  4. TABS                         ║
   ╚══════════════════════════════════╝ */
.tabs{
  display: flex;
  gap: 4px;
  padding: 3px;
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.tab{
  flex: 1;
  height: 32px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font: 600 13px/1 'Inter', sans-serif;
  transition: all .15s;
}
.tab:hover{ color: var(--text); background: rgba(255,255,255,0.04); }
.tab.active{
  background: var(--accent-bg);
  color: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  5. COLLAPSIBLE SECTIONS         ║
   ╚══════════════════════════════════╝ */
details.section{
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.02);
  overflow: hidden;
  transition: background .15s;
}
details.section[open]{ background: rgba(255,255,255,0.03); }
details.section + details.section{ margin-top: 2px; }

summary{
  padding: 10px 12px;
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
summary::-webkit-details-marker{ display: none; }
summary::before{
  content: '';
  width: 5px; height: 5px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(-45deg);
  transition: transform .15s;
  flex-shrink: 0;
}
details[open] > summary::before{ transform: rotate(45deg); }
summary:hover{ color: var(--text); }

.section-body{ padding: 4px 12px 12px; }


/* ╔══════════════════════════════════╗
   ║  6. FORM CONTROLS                ║
   ╚══════════════════════════════════╝ */
.row{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin: 6px 0;
}
label{
  display: flex;
  flex-direction: column;
  gap: 4px;
  font: 500 11px/1.3 'Inter', sans-serif;
  color: var(--muted);
}
input[type="number"], input[type="text"], select, textarea{
  font: 400 13px/1.3 'Inter', sans-serif;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input[type="number"]:focus, input[type="text"]:focus, select:focus, textarea:focus{
  border-color: var(--accent);
}
input[type="number"], input[type="text"], select{
  height: 32px;
  min-width: 100px;
  padding: 4px 8px;
}
textarea{
  width: 100%;
  min-height: 56px;
  padding: 8px;
  resize: vertical;
}
input[type="color"]{
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
  padding: 2px;
}
input[type="range"]{
  width: 100%;
  accent-color: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  7. TOGGLE SWITCH                ║
   ╚══════════════════════════════════╝ */
.toggle{
  position: relative;
  width: 36px; height: 20px;
  flex-shrink: 0;
}
.toggle input{ opacity: 0; width: 0; height: 0; }
.toggle-track{
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s;
}
.toggle-track::after{
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--muted);
  transition: all .15s;
}
.toggle input:checked + .toggle-track{
  background: var(--accent-bg);
}
.toggle input:checked + .toggle-track::after{
  left: 18px;
  background: var(--accent);
}


/* ╔══════════════════════════════════╗
   ║  8. BUTTONS & ACTIONS            ║
   ╚══════════════════════════════════╝ */
.actions{ display: flex; gap: 6px; padding: 8px 0; }

.btn{
  height: 34px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  cursor: pointer;
  font: 600 13px/1 'Inter', sans-serif;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn:hover{ background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
.btn:active{ transform: scale(0.97); }

.btn.primary{
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover{ background: #4a8de8; }

small{ color: var(--muted); font-size: 11px; line-height: 1.4; display: block; margin: 4px 0; }


/* ╔══════════════════════════════════╗
   ║  9. LOADING OVERLAY              ║
   ╚══════════════════════════════════╝ */
.loading{
  position: fixed;
  top: 12px; right: 12px;
  padding: 8px 14px;
  background: var(--panel);
  border: 1px solid var(--accent-border);
  border-radius: 8px;
  font: 500 12px/1 'Inter', sans-serif;
  color: var(--accent);
  z-index: 999;
  display: none;
  align-items: center;
  gap: 8px;
}
.loading.show{ display: flex; }
.spinner{
  width: 14px; height: 14px;
  border: 2px solid var(--accent-bg);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }


/* ╔══════════════════════════════════╗
   ║  10. A4 PAGE                     ║
   ╚══════════════════════════════════╝ */
.page{
  width: var(--page-w);
  height: var(--page-h);
  background: #fff;
  color: #0a0a0a;
  border-radius: 16px;
  box-shadow: 0 14px 50px rgba(0,0,0,.45);
  overflow: hidden;
  position: relative;
}
.inner{ width: 100%; height: 100%; }


/* ╔══════════════════════════════════╗
   ║  11. POSTER                      ║
   ╚══════════════════════════════════╝ */
.poster .inner{
  padding: var(--pad-poster);
  display: flex;
  flex-direction: column;
}
.poster-title{
  text-align: center;
  font-family: "VT323", ui-monospace, monospace;
  padding: 20px 0 10px;
  line-height: 1;
}
.poster-title .region{
  font-size: 80px;
  font-weight: 800;
  letter-spacing: 4px;
  color: #111;
}
.poster-title .gen{
  font-size: 36px;
  letter-spacing: 2px;
  color: #555;
  margin-top: 6px;
}
.poster-grid{
  flex: 1;
  display: grid;
  grid-template-columns: repeat(var(--poster-cols), 1fr);
  grid-template-rows: repeat(var(--poster-rows), 1fr);
  gap: var(--poster-gap);
}
.poster-grid.neg-gap{
  gap: 0;
  column-gap: calc(var(--poster-gap-abs) * -1);
  row-gap: calc(var(--poster-gap-abs) * -1);
}
.poster .cell{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.caption{
  margin-top: 6px;
  font-family: "VT323", ui-monospace, monospace;
  font-size: var(--poster-name-fz);
  color: var(--poster-name-color);
  line-height: 1;
  text-align: center;
}
.caption .dex{ opacity: .6; margin-right: 6px; }
.poster .caption{ margin-top: 2px; }
.poster .sprite-wrap{ width: 100%; }


/* ╔══════════════════════════════════╗
   ║  12. CARDS GRID                  ║
   ╚══════════════════════════════════╝ */
.cards .inner{
  padding: var(--pad-cards);
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.grid{
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: repeat(var(--card-cols), var(--card-w));
  grid-template-rows: repeat(var(--card-rows), var(--card-h));
  gap: var(--card-gap);
  justify-content: center;
  align-content: center;
}
.grid.neg-gap{
  gap: 0;
  column-gap: calc(var(--card-gap-abs) * -1);
  row-gap: calc(var(--card-gap-abs) * -1);
}


/* ╔══════════════════════════════════╗
   ║  13. CARD COMPONENT              ║
   ╚══════════════════════════════════╝ */

/* --- Card shell --- */
.card{
  width: var(--card-w);
  height: var(--card-h);
  background: var(--card-box-bg);
  color: var(--card-box-ink);
  border-radius: 24px;
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.placeholder{ visibility: hidden; }

/* --- Head (name + number + type icon) --- */
.head{
  padding: calc(var(--card-pad) * 1.6) calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 0.6);
  border: none;
  font-family: "VT323", ui-monospace, monospace;
  line-height: 1;
}
.head .line{
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.head .bold{
  font-weight: 900;
  font-size: 34px;
  letter-spacing: .8px;
  line-height: 1.05;
}
.head .num{
  display: block;
  margin-top: 8px;
  font-size: 28px;
  opacity: .7;
}
.head .right{
  margin-left: auto;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  min-width: 56px;
}

/* --- Core (main sprite) --- */
.core{
  padding: 8px 0 0;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.sprite-wrap{
  position: relative;
  width: var(--img);
  height: var(--img);
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateY(var(--sprite-shift-y));
}
img.poke{
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
img.poke.pixel{
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* --- Evolution strip --- */
.evo-strip{
  padding: calc(var(--card-pad) * 0.6) calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  border: none;
  flex: 0 0 auto;
}
.mini-wrap{
  width: calc(var(--mini) * var(--evo-box-scale));
  height: calc(var(--mini) * var(--evo-box-scale));
  border-radius: 14px;
  background: color-mix(in srgb, var(--evo-box-bg) calc(var(--evo-box-on) * 100%), transparent);
  border: 1px solid color-mix(in srgb, var(--evo-box-border) calc(var(--evo-box-on) * 100%), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-wrap.current{
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.10);
}
img.mini{
  width: calc(var(--mini) * 0.82);
  height: calc(var(--mini) * 0.82);
  object-fit: contain;
  display: block;
}
.arrow{
  width: 30px; height: 2px;
  background: rgba(0,0,0,0.35);
  border-radius: 99px;
  position: relative;
  opacity: .35;
}
.arrow::after{
  content: "";
  position: absolute;
  right: -2px; top: 50%;
  width: 6px; height: 6px;
  transform: translateY(-50%) rotate(45deg);
  border-right: 2px solid rgba(0,0,0,0.35);
  border-top: 2px solid rgba(0,0,0,0.35);
}

/* --- Info (ability, region, description) --- */
.info{
  padding: calc(var(--card-pad) * 1.0) calc(var(--card-pad) * 2.2) calc(var(--card-pad) * 1.4);
  border-top: 1px solid rgba(0,0,0,0.07);
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 0 0 auto;
}
.meta{
  color: rgba(0,0,0,0.72);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.meta b{
  color: rgba(0,0,0,0.88);
  font-size: var(--meta-label-fz);
}
.meta .meta-val{ font-size: var(--meta-value-fz); }
.desc{
  display: block;
  line-height: 1.4;
  color: rgba(0,0,0,0.72);
  max-height: 5.2em;
  overflow: hidden;
  font-style: italic;
}

/* --- Type icon badge --- */
.type-badge{ display: flex; align-items: flex-start; justify-content: flex-end; }
.type-icon-wrap{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.type-icon-wrap svg{
  width: 56px; height: 56px;
  display: block;
}
.type-icon-fallback{
  width: 56px; height: 56px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: "VT323", ui-monospace, monospace;
  font-size: 30px;
}
.type-name-tag{
  font-family: "VT323", ui-monospace, monospace;
  font-size: 18px;
  letter-spacing: 1px;
  line-height: 1;
}

/* --- Ability pills --- */
.ab-list{
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.ab-tag{
  background: rgba(0,0,0,0.07);
  border-radius: 5px;
  padding: 3px 9px;
  font-size: var(--meta-value-fz);
  line-height: 1.4;
}
.ab-tag.ab-hidden{
  opacity: 0.5;
  font-style: italic;
}


/* ╔══════════════════════════════════╗
   ║  14. CARD TYPOGRAPHY             ║
   ╚══════════════════════════════════╝ */

/* Auto mode: scales with card height */
.card[data-text="auto"]{
  --auto-name: clamp(26px, calc(var(--card-h) * 0.050), 72px);
  --auto-num:  clamp(20px, calc(var(--card-h) * 0.038), 52px);
  --auto-meta: clamp(14px, calc(var(--card-h) * 0.024), 34px);
  --auto-desc: clamp(12px, calc(var(--card-h) * 0.020), 28px);
}
.card[data-text="auto"] .head{ font-size: var(--auto-name); }
.card[data-text="auto"] .head .bold{ font-size: var(--auto-name); }
.card[data-text="auto"] .head .num{ font-size: var(--auto-num); }
.card[data-text="auto"] .meta{ font-size: var(--auto-meta); }
.card[data-text="auto"] .desc{ font-size: var(--auto-desc); }

/* Manual mode: user-controlled px values */
.card[data-text="manual"] .head{ font-size: var(--head-fz); }
.card[data-text="manual"] .head .bold{ font-size: var(--head-fz); }
.card[data-text="manual"] .head .num{ font-size: calc(var(--head-fz) * 0.58); }
.card[data-text="manual"] .meta{ font-size: var(--meta-fz); }
.card[data-text="manual"] .desc{ font-size: var(--desc-fz); }


/* ╔══════════════════════════════════╗
   ║  15. PRINT & EXPORT              ║
   ╚══════════════════════════════════╝ */
body[data-exporting="1"] .stage{ transform: none !important; }

@media print{
  @page{ size: A4; margin: 5mm; }
  html, body{ margin: 0; padding: 0; background: #fff; }
  .sidebar, .loading{ display: none !important; }
  .stage-wrap{ padding: 0 !important; }
  .stage{ transform: none !important; }
  #root{ gap: 0 !important; }
  .page{
    border-radius: 0 !important;
    box-shadow: none !important;
    width: var(--page-w) !important;
    height: var(--page-h) !important;
    zoom: 0.30;
    margin: 0 !important;
    page-break-after: always;
    break-after: page;
    break-inside: avoid;
  }
  *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>
</head>

<body data-mode="cards">

<!-- ══════ LOADING INDICATOR ══════ -->
<div id="loadingIndicator" class="loading">
  <div class="spinner"></div>
  <span>Building...</span>
</div>

<div class="app">
  <aside class="sidebar">

    <!-- ══════ SIDEBAR HEADER + TABS ══════ -->
    <div class="sidebar-header">
      <h1>Pokédex Builder</h1>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="poster">Poster</button>
      <button class="tab" data-mode="cards">Cards</button>
    </div>

    <!-- ══════ DATASET & LOOK ══════ -->
    <details class="section" open>
      <summary>Dataset & Look</summary>
      <div class="section-body">
        <div class="row">
          <label>Generation
            <select id="gen">
              <option value="1" selected>Gen 1 — Kanto</option>
              <option value="2">Gen 2 — Johto</option>
              <option value="3">Gen 3 — Hoenn</option>
              <option value="4">Gen 4 — Sinnoh</option>
              <option value="5">Gen 5 — Unova</option>
              <option value="6">Gen 6 — Kalos</option>
              <option value="7">Gen 7 — Alola</option>
              <option value="8">Gen 8 — Galar</option>
              <option value="9">Gen 9 — Paldea</option>
              <option value="all">All</option>
            </select>
          </label>
          <label>Art style
            <select id="style">
              <option value="pixel" selected>Pixel (96px)</option>
              <option value="home">HD (HOME)</option>
              <option value="art">Official art</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Pixel scale
            <select id="pxScale"><option value="auto" selected>Auto</option></select>
          </label>
          <label>Language
            <select id="lang">
              <option value="en" selected>EN</option>
              <option value="pt">PT</option>
            </select>
          </label>
        </div>
        <div class="row" style="align-items:center">
          <label style="flex-direction:row;gap:8px;align-items:center">
            <div class="toggle">
              <input id="snapInt" type="checkbox" checked>
              <div class="toggle-track"></div>
            </div>
            Snap to integer pixels
          </label>
        </div>
        <div class="row">
          <label style="width:100%">UI Zoom
            <input id="zoom" type="range" min="0.35" max="1" step="0.01" value=".55">
          </label>
        </div>
        <div class="row">

<script>

// ╔══════════════════════════════════╗
// ║  1. UTILITIES                    ║
// ╚══════════════════════════════════╝
const el = id => document.getElementById(id);
const v  = id => el(id).value;
const setVar = (k, val) => document.documentElement.style.setProperty(k, val);


// ╔══════════════════════════════════╗
// ║  2. API CACHE                    ║
// ╚══════════════════════════════════╝
const apiCache = new Map();
async function cachedFetch(url){
  if(apiCache.has(url)) return apiCache.get(url);
  const r = await fetch(url);
  const j = await r.json();
  apiCache.set(url, j);
  return j;
}
async function fetchTypeIcon(t){
  const key = 'svg:'+t;
  if(apiCache.has(key)) return apiCache.get(key);
  try{
    const r = await fetch(`https://cdn.jsdelivr.net/gh/partywhale/pokemon-type-icons@main/icons/${t}.svg`);
    if(!r.ok) return null;
    const txt = await r.text();
    apiCache.set(key, txt);
    return txt;
  }catch{ return null; }
}


// ╔══════════════════════════════════╗

// ╚══════════════════════════════════╝

}

// ╔══════════════════════════════════╗
// ║  5. DATA HELPERS                  ║
// ╚══════════════════════════════════╝

const GEN_REGIONS = {
  1:'KANTO', 2:'JOHTO', 3:'HOENN', 4:'SINNOH', 5:'UNOVA',
  6:'KALOS', 7:'ALOLA', 8:'GALAR', 9:'PALDEA', all:'ALL REGIONS'
};
const API_GEN_TO_REGION = {
  'generation-i':'KANTO','generation-ii':'JOHTO','generation-iii':'HOENN',
  'generation-iv':'SINNOH','generation-v':'UNOVA','generation-vi':'KALOS',
  'generation-vii':'ALOLA','generation-viii':'GALAR','generation-ix':'PALDEA'
};

function titleName(n){ return n.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

async function genSpecies(gen){
  const j = await cachedFetch(`https://pokeapi.co/api/v2/generation/${gen}/`);
  return j.pokemon_species
    .map(s => ({ id: +s.url.split('/').slice(-2,-1)[0], name: titleName(s.name) }))
    .sort((a,b) => a.id - b.id);
}
async function allSpecies(){
  const a = await Promise.all([1,2,3,4,5,6,7,8,9].map(genSpecies));
  return a.flat();
}
async function speciesById(id){
  const j = await cachedFetch(`https://pokeapi.co/api/v2/pokemon-species/${id}/`);
  return {
    id: +id,
    name: titleName(j.name),
    chain: j.evolution_chain?.url,
    generation: j.generation?.name,
    _raw: j
  };
}
async function pokemonData(id){
  const j = await cachedFetch(`https://pokeapi.co/api/v2/pokemon/${id}/`);
  return {
    types: j.types.map(t => t.type.name),
    abilities: j.abilities.sort((a,b) => a.slot - b.slot)
      .map(a => ({ name: titleName(a.ability.name), hidden: a.is_hidden }))
  };
}
function flavorFromRaw(raw, lang){
  const pref = (lang==='pt') ? ['pt-BR','pt','en'] : ['en'];
  for(const L of pref){
    const hit = raw.flavor_text_entries.find(ft => ft.language?.name === L);
    if(hit) return hit.flavor_text.replace(/\f|\n/g,' ').replace(/\s+/g,' ').trim();
  }
  return '';
}
async function evoLine(url){
  if(!url) return [];
  const j = await cachedFetch(url).catch(() => null);
  if(!j) return [];
  const out = [];
  (function walk(n){
    out.push(+n.species.url.split('/').slice(-2,-1)[0]);
    (n.evolves_to||[]).forEach(walk);
  })(j.chain);
  return [...new Set(out)];
}
async function preloadImages(root){
  const imgs = [...root.querySelectorAll('img')];
  await Promise.all(imgs.map(i => i.decode().catch(()=>{})));
}
async function readyFonts(){ try{ await document.fonts.ready; }catch{} }

function parseIds(text){
  return [...new Set(
    (text||'').split(/[\s,;]+/)
      .map(s => parseInt(String(s).replace(/\D/g,''), 10))
      .filter(n => Number.isFinite(n) && n > 0)
  )];
}
async function resolveListFromIds(ids){
  return Promise.all(ids.map(async id => {
    try{
      const sp = await speciesById(id);
      return { id: sp.id, name: sp.name, chain: sp.chain, generation: sp.generation };
    } catch {
      return { id: +id, name: '#'+id, chain: null, generation: null };
    }
  }));
}


// ╔══════════════════════════════════╗
// ║  6. ASSETS                        ║
// ╚══════════════════════════════════╝
function artURL(id, style){
  if(style === 'pixel') return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  if(style === 'home')  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`;
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
}
function spriteWrap(url, style){
  const wrap = document.createElement('div'); wrap.className = 'sprite-wrap';
  const img = document.createElement('img');
  img.className = 'poke' + (style==='pixel' ? ' pixel' : '');
  img.crossOrigin = 'anonymous';
  img.decoding = 'async';
  img.src = url;
  wrap.appendChild(img);
  return wrap;
}
function typeColor(t){
  return ({
    normal:'#A8A77A',fire:'#EE8130',water:'#6390F0',electric:'#F7D02C',grass:'#7AC74C',ice:'#96D9D6',
    fighting:'#C22E28',poison:'#A33EA1',ground:'#E2BF65',flying:'#A98FF3',psychic:'#F95587',bug:'#A6B91A',
    rock:'#B6A136',ghost:'#735797',dragon:'#6F35FC',dark:'#705746',steel:'#B7B7CE',fairy:'#D685AD'
  })[t] || '#777';
}


// ╔══════════════════════════════════╗
// ║  7. LAYOUT MATH                   ║
// ╚══════════════════════════════════╝
function cardDims(cols, rows, pad, gap){
  const W = 2480-2*pad, H = 3508-2*pad, AR = 87/56, g = Math.max(gap, 0);
  let w = (W - g*(cols-1)) / cols, h = w * AR;
  if(rows*h + g*(rows-1) > H){ h = (H - g*(rows-1)) / rows; w = h / AR; }
  return { w: Math.floor(w), h: Math.floor(h) };
}
function spriteSize(w, h, style){
  if(style !== 'pixel') return Math.floor(Math.min(w,h) * 0.88);
  const base = 96;
  let k;
  if(v('pxScale') === 'auto'){
    k = Math.min(w,h) / base;
    k = el('snapInt').checked ? Math.floor(k) : Math.round(k);
  } else {
    k = parseInt(v('pxScale'), 10);
  }
  return base * Math.max(1, k);
}

// Poster-specific sprite size: fills cell minus caption height, respects pxScale for pixel art
function posterImgSize(cellW, cellH, style){
  const captionH = parseInt(v('capPx')) + 4;    // font-size + 2px margin + 2px buffer
  const avail = Math.min(cellW, cellH - captionH);
  if(style !== 'pixel') return Math.floor(avail);
  const base = 96;
  if(v('pxScale') === 'auto'){
    const k = el('snapInt').checked ? Math.floor(avail/base) : Math.round(avail/base);
    return base * Math.max(1, k);
  }
  const desired = base * Math.max(1, parseInt(v('pxScale'), 10));
  return desired <= avail ? desired : base * Math.max(1, Math.floor(avail/base));
}

function chunk(arr, size){
  const out = [];
  for(let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
  return out;
}
async function buildChainsFromList(list){
  const chainMap = new Map();
  for(const item of list){
    const sp = item.chain ? item : await speciesById(item.id);
    if(!sp.chain){
      chainMap.set('nochain:'+sp.id, { ids: [sp.id] });
      continue;
    }
    if(!chainMap.has(sp.chain)){
      const ids = await evoLine(sp.chain).catch(() => [sp.id]);
      chainMap.set(sp.chain, { ids: ids.sort((a,b) => a-b) });
    }
  }
  return [...chainMap.values()].sort((a,b) => (a.ids[0]||99999) - (b.ids[0]||99999));
}


// ╔══════════════════════════════════╗
// ║  8. RENDER: POSTER                ║
// ╚══════════════════════════════════╝
async function renderPoster(list){
  const cols = +v('posterCols'), rows = +v('posterRows'), gap = +v('posterGap'), pad = +v('posterPad');
  const style = v('style');

  setVar('--pad-poster', pad+'px');
  setVar('--poster-cols', cols);
  setVar('--poster-rows', rows);
  if(gap >= 0){ setVar('--poster-gap', gap+'px'); setVar('--poster-gap-abs','0px'); }
  else { setVar('--poster-gap','0px'); setVar('--poster-gap-abs', Math.abs(gap)+'px'); }

  setVar('--poster-name-fz', v('capPx')+'px');
  setVar('--poster-name-color', v('capColor'));

  // Subtract title height (matches CSS: 80px region + 6px margin + 36px gen + 20+10px padding)
  const capPx  = parseInt(v('capPx'));
  const titleH = 152;
  const cellW  = (2480 - 2*pad) / cols;
  const cellH  = (3508 - 2*pad - titleH) / rows;
  setVar('--img', posterImgSize(cellW, cellH, style) + 'px');

  const root = el('root');
  root.innerHTML = '';

  const page = document.createElement('div'); page.className = 'page poster';
  const inner = document.createElement('div'); inner.className = 'inner';

  // Title: KANTO (big) + GEN1 (smaller)
  const gen = v('gen');
  const region = GEN_REGIONS[gen] || 'REGION';
  const genLabel = (gen==='all') ? 'GEN 1–9' : ('GEN ' + gen);

  const title = document.createElement('div'); title.className = 'poster-title';
  title.innerHTML = `<div class="region">${region}</div><div class="gen">${genLabel}</div>`;

  // Grid
  const grid = document.createElement('div');
  grid.className = 'poster-grid' + (gap<0 ? ' neg-gap' : '');

  list.slice(0, cols*rows).forEach(pk => {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.appendChild(spriteWrap(artURL(pk.id, style), style));
    const cap = document.createElement('div'); cap.className = 'caption';
    cap.innerHTML = `<span class="dex">#${String(pk.id).padStart(3,'0')}</span><span class="nm">${pk.name}</span>`;
    cell.appendChild(cap);
    grid.appendChild(cell);
  });

  inner.appendChild(title);
  inner.appendChild(grid);
  page.appendChild(inner);
  root.appendChild(page);
  await preloadImages(page);
}


// ╔══════════════════════════════════╗
// ║  9. RENDER: CARD + CARDS          ║
// ╚══════════════════════════════════╝
async function renderCard(pkId, style, lang, textMode, showRegion=true){
  const sp = await speciesById(pkId);
  const pd = await pokemonData(pkId).catch(() => ({types:[], abilities:[]}));

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.text = textMode;

  // Head
  const head = document.createElement('div'); head.className = 'head';
  head.innerHTML = `<div class="line"><div><div class="bold">${sp.name.toUpperCase()}</div><div class="num">No.${String(pkId).padStart(3,'0')}</div></div><div class="right"></div></div>`;

  // Core
  const core = document.createElement('div'); core.className = 'core';
  core.appendChild(spriteWrap(artURL(pkId, style), style));

  // Evo strip
  const evo = document.createElement('div'); evo.className = 'evo-strip';
  const chainIds = await evoLine(sp.chain).catch(() => [pkId]);
  const ids = chainIds.length ? chainIds : [pkId];

  ids.forEach((id, i) => {
    const w = document.createElement('div');
    w.className = 'mini-wrap' + (id===pkId ? ' current' : '');
    const m = document.createElement('img');
    m.className = 'mini';
    m.crossOrigin = 'anonymous';
    m.decoding = 'async';
    m.src = (style==='pixel')
      ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`
      : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`;
    w.appendChild(m);
    evo.appendChild(w);
    if(i < ids.length-1){
      const a = document.createElement('div'); a.className = 'arrow';
      evo.appendChild(a);
    }
  });

  // Info
  const info = document.createElement('div'); info.className = 'info';
  const meta = document.createElement('div'); meta.className = 'meta';

  const region = API_GEN_TO_REGION[sp.generation] || 'REGION';
  const abTags = (pd.abilities||[]).slice(0,4).map(a =>
    `<span class="ab-tag${a.hidden ? ' ab-hidden' : ''}">${a.name}</span>`
  ).join('');
  meta.innerHTML = `<div><b>Abilities</b><div class="ab-list">${abTags || '<span class="ab-tag">\u2014</span>'}</div></div>${showRegion ? `<div><b>Region:</b> <span class="meta-val">${region}</span></div>` : ''}`;

  const desc = document.createElement('div'); desc.className = 'desc';
  desc.textContent = sp._raw ? flavorFromRaw(sp._raw, lang) : '';

  info.append(meta, desc);

  // Type badge: inline SVG symbol (no circle) + name tag below
  const badge = document.createElement('div'); badge.className = 'type-badge';
  const mainType = pd.types?.[0] || 'normal';
  const iconColor = typeColor(mainType);
  const iconWrap = document.createElement('div'); iconWrap.className = 'type-icon-wrap';
  const svgText = await fetchTypeIcon(mainType);
  let svgInserted = false;
  if(svgText){
    try{
      const svgDoc = (new DOMParser()).parseFromString(svgText, 'image/svg+xml');
      const svgEl = svgDoc.documentElement;
      if(svgEl.tagName.toLowerCase() === 'svg' && !svgEl.querySelector('parsererror')){
        // Inject CSS: hide circle background, color all symbol paths with type color
        const st = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'style');
        st.textContent = `circle{display:none!important}path,polygon,polyline,ellipse,rect{fill:${iconColor}!important}`;
        svgEl.insertBefore(st, svgEl.firstChild);
        svgEl.removeAttribute('width'); svgEl.removeAttribute('height');
        svgEl.style.cssText = 'display:block;flex-shrink:0;';
        iconWrap.appendChild(document.importNode(svgEl, true));
        svgInserted = true;
      }
    }catch(_){}
  }
  if(!svgInserted){
    const fb = document.createElement('div'); fb.className = 'type-icon-fallback';
    fb.textContent = mainType[0].toUpperCase(); fb.style.background = iconColor;
    iconWrap.appendChild(fb);
  }
  const nameTag = document.createElement('div'); nameTag.className = 'type-name-tag';
  nameTag.textContent = mainType.toUpperCase();
  nameTag.style.color = iconColor;
  iconWrap.appendChild(nameTag);
  badge.appendChild(iconWrap);

  card.append(head, core, evo, info);
  head.querySelector('.right').appendChild(badge);
  return card;
}

async function renderCards(list){
  const cols = +v('cardCols'), rows = +v('cardRows'), gap = +v('cardGap'), pad = +v('cardsPad');
  const cardPad = +v('cardPad'), style = v('style'), lang = v('lang');
  const paging = v('cardsPaging'), textMode = v('textMode');

  setVar('--pad-cards', pad+'px');
  setVar('--card-cols', cols);
  setVar('--card-rows', rows);
  if(gap >= 0){ setVar('--card-gap', gap+'px'); setVar('--card-gap-abs','0px'); }
  else { setVar('--card-gap','0px'); setVar('--card-gap-abs', Math.abs(gap)+'px'); }
  setVar('--card-pad', cardPad+'px');
  setVar('--sprite-shift-y', v('spriteY')+'px');

  const evoOn = el('evoBoxOn').checked;
  const evoScale = parseFloat(el('evoBoxScale').value) || 0.8;
  setVar('--evo-box-scale', evoScale);
  setVar('--evo-box-bg', evoOn ? el('evoBoxColor').value : 'transparent');
  setVar('--evo-box-border', evoOn ? el('evoBorderColor').value : 'transparent');
  setVar('--evo-fill', v('evoFill'));
  setVar('--evo-stroke', v('evoStroke'));
  setVar('--card-box-bg', v('cardBoxBg'));
  setVar('--card-box-ink', v('cardBoxInk'));

  setVar('--head-fz', v('cHead')+'px');
  setVar('--meta-fz', v('cMeta')+'px');
  setVar('--meta-label-fz', v('metaLabelSize')+'px');
  setVar('--meta-value-fz', v('metaValueSize')+'px');
  setVar('--desc-fz', v('cDesc')+'px');
  setVar('--meta-gap', v('metaGap')+'px');

  const dims = cardDims(cols, rows, pad, gap);
  setVar('--card-w', dims.w+'px');
  setVar('--card-h', dims.h+'px');

  const baseMini = +v('miniSize') || 56;
  setVar('--mini', Math.round(dims.w * (baseMini / 760)) + 'px');

  const imgSz = spriteSize(dims.w - cardPad*2, dims.h - cardPad*2, style);
  setVar('--img', imgSz+'px');

  const gens = new Set(list.map(x => x.generation).filter(Boolean));
  const showRegion = gens.size <= 1;

  const perPage = cols * rows;
  const root = el('root');
  root.innerHTML = '';

  async function renderPage(pageIds){
    const page = document.createElement('div'); page.className = 'page cards';
    const inner = document.createElement('div'); inner.className = 'inner';
    const grid = document.createElement('div');
    grid.className = 'grid' + (gap<0 ? ' neg-gap' : '');

    for(const id of pageIds){
      grid.appendChild(await renderCard(id, style, lang, textMode, showRegion));
    }
    for(let k = 0; k < perPage - pageIds.length; k++){
      const ph = document.createElement('div'); ph.className = 'card placeholder';
      grid.appendChild(ph);
    }
    inner.appendChild(grid);
    page.appendChild(inner);
    root.appendChild(page);
    await preloadImages(page);
  }

  if(paging === 'evolution'){
    const chains = await buildChainsFromList(list);
    const start = Math.max(1, parseInt(v('chainStart'),10)||1) - 1;
    const count = Math.max(1, parseInt(v('chainCount'),10)||10);
    for(const ch of chains.slice(start, start+count)){
      for(let i=0; i<ch.ids.length; i+=perPage){
        await renderPage(ch.ids.slice(i, i+perPage));
      }
    }
  } else {
    for(const pageIds of chunk(list.map(x=>x.id), perPage)){
      await renderPage(pageIds);
    }
  }
}


// ╔══════════════════════════════════╗
// ║  10. BUILD ORCHESTRATOR           ║
// ╚══════════════════════════════════╝
async function build(){
  showLoading();
  try{
    await readyFonts();
    setVar('--zoom', v('zoom'));

    const ids = parseIds(el('specificIds').value);
    let list;
    if(ids.length){
      list = await resolveListFromIds(ids);
    } else if(MODE.get() === 'cards'){
      el('root').innerHTML = '';
      return;
    } else {
      const gen = v('gen');
      list = (gen==='all') ? await allSpecies() : await genSpecies(gen);
    }

    if(MODE.get() === 'poster') await renderPoster(list);
    else await renderCards(list);
  } finally {
    hideLoading();
  }
}


// ╔══════════════════════════════════╗
// ║  11. EVENT WIRING                 ║
// ╚══════════════════════════════════╝
[
  'gen','style','pxScale','snapInt','lang','zoom','specificIds',
  'posterCols','posterRows','posterGap','posterPad','capPx','capColor',
  'cardCols','cardRows','cardGap','cardsPad','cardsPaging','chainStart','chainCount',
  'cardPad','spriteY','miniSize','evoFill','evoStroke','evoBoxOn','evoBoxScale','evoBoxColor','evoBorderColor',
  'textMode','cHead','cMeta','cDesc','metaGap','metaLabelSize','metaValueSize','cardBoxBg','cardBoxInk'
].forEach(id => el(id).addEventListener('input', debouncedBuild));

el('printBtn').addEventListener('click', async () => {
  await readyFonts();
  for(const p of document.querySelectorAll('.page')) await preloadImages(p);
  window.print();
});

el('downloadBtn').addEventListener('click', async () => {
  await readyFonts();
  const page = document.querySelector('.page');
  if(!page) return;
  document.body.dataset.exporting = '1';
  await preloadImages(page);
  const canvas = await html2canvas(page, { scale:3, useCORS:true, backgroundColor:'#ffffff' });
  document.body.removeAttribute('data-exporting');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'page.png';
  a.click();
});

el('buildBtn').addEventListener('click', build);


// ╔══════════════════════════════════╗
// ║  12. INIT                         ║
// ╚══════════════════════════════════╝
MODE.set('cards');

</script>
</body>
